<!DOCTYPE html>
<html lang="en">
<head>
<meta chartset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Revline Auto Performance Parts</title>
 <link rel="stylesheet" href="style.css">  
</head>
<body>

  <div class="header-container">
<img src="Photos/Revline Auto Performance Parts Logo.png" alt="Revline Auto Performance Parts Logo" class="store-logo">
  </div>

  <div class="main-container">

<div class="products-grid">

<div class="product-card">
<h3>T200 Turbocharger</h3>
<div class="Photos/"></div>
<p>$600.00</p>
<button onClick="addItem('T200 Turbocharger','600')">Add to order </button>
</div>

<div class="product-card">
<h3>T400 Turbocharger</h3>
<div class="Photos/"></div>
<p>$1200.00</p>
<button onClick="addItem('T400 Turbocharger','1200')">Add to order</button>
</div>

<div class="product-card">
<h3>T600 Turbocharger</h3>
<div class="Photos/"></div>
<p>$1800.00</p>
<button onClick="addItem('T600 Turbocharger', 1800)">Add to order</button>
</div>


</div>


<div class="order-sidebar">
<h2>My Order</h2>

<div id="orderitemsdisplay"></div>

<div class="details">
<h4>Details:</h4>
<div class="input-group">
<label>Name:</label>
<input type="text" id="customerName">
</div>

<div class="input-group">
<label>Money:</label>
<input type="number" id="moneyPaid">
</div>

<button class="action-button" onclick="submitOrder()">Submit</button>
</div>

<button class="action-button clear-button" onclick="clearAll()">Clear order</button>

<div id="receipt"></div>
</div>
</div>
  
<script src="script.js"></script>
</body>
</html>

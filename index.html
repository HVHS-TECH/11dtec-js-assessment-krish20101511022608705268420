<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Revline Auto Performance Parts</title>
 <link rel="stylesheet" href="style.css">  
</head>
<style>
  body{
font-family: Arial, Helvetica, sans-serif;
background-color: crimson;
margin: 0px;
padding: 20px;
}

.head-container{
    text-align: center;
}

.store-logo{
    width:250px;
}
.main-container{
display: flex;
gap:30px;
}
.products-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    width:60%;
}
.product-card{
    border:1px solid black;
    background-color: white;
    padding: 10px;
}
.order-sidebar{
    width: 40%;
    border:1px solid black;
    background-color: white;
    padding: 10px;
}
</style>
<body>

  <div class="head-container">
<img src="Photos/Revline Auto Performance Parts Logo.png" alt="Revline Auto Performance Parts Logo" class="store-logo">
  </div>

  <div class="main-container">

<div class="products-grid">

<div class="product-card">
<h3>T200 Turbocharger</h3>
<img src="Photos/T200-Turbo.png" alt="T200-Turbo" class="product-photo">
<p>$600.00</p>
<button onClick="addItem('T200 Turbocharger','600')">Add to order </button>
</div>

<div class="product-card">
<h3>T400 Turbocharger</h3>
<div class="Photos/"></div>
<p>$1200.00</p>
<button onClick="addItem('T400 Turbocharger','1200')">Add to order</button>
</div>

<div class="product-card">
<h3>T600 Turbocharger</h3>
<div class="Photos/"></div>
<p>$1800.00</p>
<button onClick="addItem('T600 Turbocharger', 1800)">Add to order</button>
</div>


</div>


<div class="order-sidebar">
<h2>My Order</h2>

<div id="orderItemsDisplay"></div>

<div class="details">
<h4>Details:</h4>
<div class="input-group">
<label>Name:</label>
<input type="text" id="customerName">
</div>

<div class="input-group">
<label>Money:</label>
<input type="number" id="moneyPaid">
</div>

<button class="action-button" onClick="submitOrder()">Submit</button>
</div>

<button class="action-button clear-button" onclick="clearAll()">Clear order</button>

<div id="receipt"></div>
</div>
</div>
  
<script src="script.js"></script>
</body>
</html>
